<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework Hub · Tr. Alex · Bahlool British International School</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(145deg, #f5f9ff 0%, #dae5f0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app-container {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 48px;
      box-shadow: 0 30px 50px rgba(0, 20, 40, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.6);
      padding: 40px 36px;
      text-align: center;
    }
    .badge-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }
    .badge {
      background: #1e3c72;
      color: white;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .badge.teacher { background: #2b5876; }
    h1 {
      font-size: 2.1rem;
      color: #0b2b4a;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    h2 {
      font-size: 1.15rem;
      color: #2b5876;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #5b7c99;
      margin-bottom: 34px;
    }
    .pick {
      font-size: 1.1rem;
      color: #2c5778;
      margin-bottom: 22px;
    }
    .class-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 640px;
      margin: 0 auto;
    }
    @media (min-width: 620px) {
      .class-grid { grid-template-columns: 1fr 1fr; }
    }
    .class-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: white;
      border: 1.5px solid #d0e0ee;
      border-radius: 40px;
      padding: 32px 22px;
      text-decoration: none;
      color: #103450;
      font-weight: 600;
      box-shadow: 0 6px 14px rgba(0,0,0,0.04);
      transition: all 0.15s ease;
    }
    .class-card:hover {
      background: #e6f0fc;
      border-color: #6f9fcf;
      transform: translateY(-3px);
      box-shadow: 0 14px 24px -8px rgba(30, 111, 159, 0.35);
    }
    .class-icon {
      font-size: 2.6rem;
      line-height: 1;
    }
    .class-name {
      font-size: 1.35rem;
      color: #0b2b4a;
    }
    .class-desc {
      font-size: 0.85rem;
      color: #5b7c99;
      font-weight: 400;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #6988a3;
    }
  </style>
</head>
<body>
  <div class="app-container">

    <div class="badge-row">
      <div class="badge teacher">👨‍🏫 Tr. Alex</div>
      <div class="badge">📘 IGCSE Physics · Pearson Edexcel</div>
    </div>

    <h1>Bahlool British International School</h1>
    <h2>Tr. Alex · Physics Homework</h2>
    <p class="subtitle">IGCSE · Pearson Edexcel</p>

    <p class="pick">📚 Choose your class to continue</p>

    <div class="class-grid">
      <a class="class-card" href="yr9/">
        <span class="class-icon">🎓</span>
        <span class="class-name">Year 9</span>
        <span class="class-desc">Physics Homework</span>
      </a>

      <a class="class-card" href="yr10/">
        <span class="class-icon">🎓</span>
        <span class="class-name">Year 10</span>
        <span class="class-desc">Physics Homework</span>
      </a>
    </div>

    <div class="footer">
      © Tr. Allex · Bahlool British International School
    </div>
  </div>
</body>
</html>
